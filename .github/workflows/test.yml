name: test

on:
  push:
    branches: [main, p0/deploy-safety]
  pull_request:
    branches: [main, p0/deploy-safety]

permissions:
  contents: read

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências do VS Code e xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          install_any() {
            for package in "$@"; do
              if sudo apt-get install -y "$package"; then
                return 0
              fi
            done
            echo "Não foi possível instalar: $*" >&2
            return 1
          }
          install_any xvfb
          install_any libnss3
          install_any libnspr4
          install_any libatk1.0-0
          install_any libatk-bridge2.0-0
          install_any libcups2t64 libcups2
          install_any libdrm2
          install_any libxkbcommon0
          install_any libxcomposite1
          install_any libxdamage1
          install_any libxfixes3
          install_any libxrandr2
          install_any libgbm1
          install_any libasound2t64 libasound2
          install_any libpango-1.0-0
          install_any libcairo2
          install_any libgtk-3-0t64 libgtk-3-0
          install_any libx11-xcb1
          install_any libxshmfence1
          install_any libxext6
          install_any libxi6
          install_any libxtst6
          install_any libatspi2.0-0
          install_any libglib2.0-0t64 libglib2.0-0
      - run: npm ci
      - name: Testes de integração no VS Code (xvfb)
        run: npm run test:integration

  package:
    name: Empacotar VSIX
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package --out ns-js-snippets-reload-0.7.0.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: ns-js-snippets-reload-0.7.0
          path: ns-js-snippets-reload-0.7.0.vsix
          if-no-files-found: error
